# Local stack: the API/web UI plus its own SQL Server. One command, no Azure needed.
#
#   cp .env.example .env      # then edit the two values
#   docker compose up --build
#
# Secrets come from .env, which is gitignored. Nothing sensitive is baked into the image.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The app's migrations run at startup, so it must not start before SQL Server is
      # actually accepting connections — "container started" is not the same thing.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: ExpenseTracker.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      Jwt__Key: ${JWT_KEY}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=expensetracker;User ID=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      RunMigrationsAtStartup: "true"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"

volumes:
  mssql-data:

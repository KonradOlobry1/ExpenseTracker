name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The test projects are built individually rather than via the solution: the solution
      # includes the MAUI head, which needs Android and iOS workloads this runner does not
      # have and does not need. Neither test project references it.
      - name: Domain tests
        run: dotnet test ExpenseTracker.Domain.Tests -c Release --logger "trx;LogFileName=domain.trx" --results-directory artifacts

      # The device half of sync — conflict resolution, tombstones, the settings merge and
      # sign-out — driven through a fake preference store and a stubbed API.
      - name: Sync client tests
        run: dotnet test ExpenseTracker.Infrastructure.Tests -c Release --logger "trx;LogFileName=infrastructure.trx" --results-directory artifacts

      # Boots the real API against in-memory SQLite, so no database or secrets are needed.
      - name: API integration tests
        run: dotnet test ExpenseTracker.Api.Tests -c Release --logger "trx;LogFileName=api.trx" --results-directory artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/*.trx
          if-no-files-found: warn

  docker:
    name: Container build
    runs-on: ubuntu-latest

    # A real SQL Server, not a stub. Three things need one. Migrations, which nothing else in
    # CI applies: the unit suite builds its schema with EnsureCreated against SQLite, so a
    # provider-specific migration failure is invisible there. Data Protection, whose key ring
    # is stored in the database, making it a startup dependency. And any page render, which
    # needs that key ring.
    #
    # The password is a throwaway for a container that exists for the length of this job and
    # is reachable only from it. It is not a secret and is deliberately inline, so the job is
    # reproducible by anyone reading it.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Smoke-Password-1"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Smoke-Password-1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7

      # Builds only — nothing is pushed. Catches a broken Dockerfile before a deploy does.
      # Context is the repository root because the API references sibling projects.
      - name: Build image
        run: docker build -f ExpenseTracker.Api/Dockerfile -t expensetracker-api:ci .

      # A built image proves compilation, not that the app runs. This starts it against the
      # service container above with migrations enabled, so the run covers schema creation,
      # the Data Protection key ring, and the Blazor host actually rendering a page.
      #
      # --network host because the app runs in its own container: service containers are on a
      # network this one would not otherwise join, and on the runner that puts SQL Server on
      # localhost:1433 and the app on localhost:8080.
      - name: Smoke test
        run: |
          CONNECTION="Server=localhost,1433;Database=expensetracker;User ID=sa;Password=Ci-Smoke-Password-1;Encrypt=True;TrustServerCertificate=True;"

          docker run -d --name ci-smoke --network host \
            -e "ASPNETCORE_HTTP_PORTS=8080" \
            -e "Jwt__Key=ci-smoke-test-signing-key-comfortably-over-32-bytes" \
            -e "RunMigrationsAtStartup=true" \
            -e "ConnectionStrings__DefaultConnection=$CONNECTION" \
            expensetracker-api:ci

          for i in $(seq 1 45); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/live)" = "200" ]; then
              echo "App is live."
              break
            fi
            if [ "$i" = "45" ]; then
              echo "App did not respond in time. Container logs:"
              docker logs ci-smoke
              exit 1
            fi
            sleep 2
          done

          fail() {
            echo "$1"
            docker logs ci-smoke
            exit 1
          }

          # Readiness proves the app reached the database — which means the migrations applied.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 http://localhost:8080/health/ready)
          [ "$code" = "200" ] || fail "Expected 200 from /health/ready, got $code"
          echo "Readiness reports a healthy database."

          # Rendering any page needs the Data Protection key ring, which is stored in the
          # database. This is the check that would catch a broken key-ring configuration.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/account/login)
          [ "$code" = "200" ] || fail "Expected 200 from /account/login, got $code"
          echo "Sign-in page rendered."

          # The API must still reject anonymous callers.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/sync/pull)
          [ "$code" = "401" ] || fail "Expected 401 from /api/sync/pull, got $code"
          echo "API rejected anonymous request as expected."

      - name: Stop container
        if: always()
        run: docker rm -f ci-smoke || true
